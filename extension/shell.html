<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bastions</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
  <div id="bastion-shell">
    <div class="bs-hotzone" aria-hidden="true"></div>
    <aside class="bs-panel">
      <header class="bs-header">
        <img class="bs-logo" src="icons/icon-32.png" alt="">
        <span class="bs-title">Bastions</span>
        <button class="bs-pin" title="Pin sidebar">📌</button>
      </header>
      <div class="bs-groups"></div>
      <footer class="bs-footer">
        <button class="bs-add" title="Add bastion URL">+</button>
        <button class="bs-reload" title="Reload active bastion (F5)">↻</button>
      </footer>
    </aside>
    <main class="bs-views"></main>
  </div>
  <script src="shell.js"></script>
</body>
</html>
